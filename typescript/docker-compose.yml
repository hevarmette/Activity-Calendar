services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: activity_user
      POSTGRES_PASSWORD: activity_pass
      POSTGRES_DB: activity_calendar
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - apps/server/.env
    environment:
      NODE_ENV: production

volumes:
  pgdata:
